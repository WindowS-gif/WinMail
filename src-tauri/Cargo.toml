[package]
name = "winmail"
version = "1.0.13"
description = "Native Rust/Tauri email campaign sender"
authors = ["WindowS-gif"]
edition = "2021"
rust-version = "1.74"
license = "MIT"
repository = "https://github.com/WindowS-gif/WinMail"

[lib]
name = "winmail_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "winmail"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1"
once_cell = "1"
rand = "0.9"
csv = "1"
email_address = "0.2"
html2text = "0.15"
hickory-resolver = { version = "0.25", features = ["tokio"] }
url = "2"
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls", "ring", "rustls-platform-verifier", "smtp-transport", "builder", "pool"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-socks = "0.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-platform-verifier = "0.7"
tauri-plugin-opener = "2.5.4"
rfd = "0.15"
